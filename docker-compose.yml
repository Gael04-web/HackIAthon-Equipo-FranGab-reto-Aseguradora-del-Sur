version: '3.8'

services:
  fraudia-claims:
    build: .
    image: fraudia-claims:latest
    container_name: fraudia-claims-app
    ports:
      - "8501:8501"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: always
